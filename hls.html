<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecteur M3U8</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        width: 90%;
        max-width: 1000px;
    }

    .controls {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
    }

    input {
        flex: 1;
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: #222;
        color: white;
        font-size: 15px;
        outline: none;
    }

    button {
        padding: 14px 22px;
        border: none;
        border-radius: 8px;
        background: #e50914;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #b20710;
    }

    video {
        width: 100%;
        max-height: 600px;
        background: black;
        border-radius: 10px;
        display: block;
    }

    #status {
        margin-top: 10px;
        color: #aaa;
        font-size: 14px;
    }
</style>
</head>

<body>

<div class="container">

    <div class="controls">
        <input
            id="url"
            type="text"
            placeholder="Colle ton URL .m3u8 ici..."
        >

        <button onclick="playVideo()">Lire</button>
    </div>

    <video id="video" controls playsinline></video>

    <div id="status"></div>

</div>

<script>
let hls = null;

function playVideo() {

    const url = document.getElementById("url").value.trim();
    const video = document.getElementById("video");
    const status = document.getElementById("status");

    if (!url) {
        status.textContent = "Entre une URL M3U8.";
        return;
    }

    // Nettoyage du lecteur précédent
    if (hls) {
        hls.destroy();
        hls = null;
    }

    video.pause();
    video.removeAttribute("src");
    video.load();

    status.textContent = "Chargement...";

    // Chrome / Firefox / Edge avec HLS.js
    if (Hls.isSupported()) {

        hls = new Hls();

        hls.loadSource(url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function () {
            status.textContent = "Lecture prête.";
            video.play().catch(() => {});
        });

        hls.on(Hls.Events.ERROR, function (event, data) {

            console.error(data);

            if (data.fatal) {
                status.textContent =
                    "Erreur HLS : " + data.details;
            }
        });

    }

    // Safari / certains navigateurs avec HLS natif
    else if (video.canPlayType("application/vnd.apple.mpegurl")) {

        video.src = url;

        video.addEventListener("loadedmetadata", function () {
            status.textContent = "Lecture prête.";
            video.play().catch(() => {});
        }, { once: true });

    }

    else {
        status.textContent =
            "Ce navigateur ne supporte pas la lecture HLS.";
    }
}
</script>

</body>
</html>
