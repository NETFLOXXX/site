<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Derniers liens</title>
<style>
  body { font-family: sans-serif; text-align: center; margin-top: 80px; }
  button { padding: 15px 30px; font-size: 18px; cursor: pointer; margin: 10px; }
  .result { margin-top: 15px; margin-bottom: 40px; font-size: 18px; min-height: 20px; }
</style>
</head>
<body>

<div>
  <button onclick="getUrl('movix_url', 'result-movix')">Obtenir le lien Movix</button>
  <div id="result-movix" class="result"></div>
</div>

<div>
  <button onclick="getUrl('streamflix_url', 'result-streamflix')">Obtenir le lien Streamflix</button>
  <div id="result-streamflix" class="result"></div>
</div>

<script>
async function getUrl(field, targetId) {
  const resultDiv = document.getElementById(targetId);
  resultDiv.textContent = "Chargement...";
  try {
    const res = await fetch("./latest.json?t=" + Date.now());
    const data = await res.json();
    const url = data[field];
    if (url) {
      resultDiv.innerHTML = `<a href="${url}" target="_blank">${url}</a><br><small>Mis à jour: ${new Date(data.updated_at).toLocaleString()}</small>`;
    } else {
      resultDiv.textContent = "Aucun lien trouvé.";
    }
  } catch (e) {
    resultDiv.textContent = "Erreur: " + e.message;
  }
}
</script>

</body>
</html>
