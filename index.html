<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Lecteur HLS Custom Anti-403</title>
    <!-- Chargement de la librairie HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <video id="video" controls style="width: 100%; max-width: 800px;"></video>

    <script>
        var video = document.getElementById('video');
        
        // Ton lien qui te donne un 403
        var streamUrl = 'https://free.finepulfe.xyz/movies/11-vgupx/master.m3u8'; 
        
        // Proxy public pour contourner le CORS (corsproxy.io ou allorigins)
        var proxyUrl = 'https://corsproxy.io/?';

        if (Hls.isSupported()) {
            var hls = new Hls({
                // Magie noire ici : On intercepte toutes les requêtes réseau du lecteur
                xhrSetup: function(xhr, url) {
                    // On redirige la requête vers le proxy
                    xhr.open('GET', proxyUrl + encodeURIComponent(url), true);
                }
            });

            hls.loadSource(streamUrl);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play();
            });
            
            // Gestion des erreurs
            hls.on(Hls.Events.ERROR, function (event, data) {
                if (data.fatal) {
                    console.error("Erreur fatale HLS:", data);
                }
            });
            
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Fallback pour Safari (qui lit le HLS nativement mais ne supporte pas xhrSetup facilement)
            video.src = proxyUrl + encodeURIComponent(streamUrl);
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    </script>

</body>
</html>
