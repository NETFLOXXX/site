```html
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecteur vidéo HLS</title>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      font-family: Arial, sans-serif;
    }

    .player {
      width: min(100%, 900px);
      background: #000;
      overflow: hidden;
    }

    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: #222;
    }

    button {
      border: 0;
      border-radius: 5px;
      padding: 8px 12px;
      background: #444;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #555;
    }

    input[type="range"] {
      cursor: pointer;
    }

    #progress {
      flex: 1;
    }

    #volume {
      width: 100px;
    }

    #time {
      color: white;
      font-size: 13px;
      white-space: nowrap;
    }
  </style>
</head>

<body>

  <div class="player">
    <video id="video" playsinline></video>

    <div class="controls">
      <button id="playPause">▶</button>

      <input
        id="progress"
        type="range"
        min="0"
        max="100"
        value="0"
      >

      <span id="time">00:00 / 00:00</span>

      <button id="mute">🔊</button>

      <input
        id="volume"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="1"
      >

      <button id="fullscreen">⛶</button>
    </div>
  </div>

  <script>
    const video = document.getElementById("video");
    const playPause = document.getElementById("playPause");
    const progress = document.getElementById("progress");
    const volume = document.getElementById("volume");
    const mute = document.getElementById("mute");
    const fullscreen = document.getElementById("fullscreen");
    const time = document.getElementById("time");

    const videoURL =
      "https://free.finepulfe.xyz/movies/11-vgupx/720p/playlist.m3u8";

    // Chargement du flux HLS
    if (Hls.isSupported()) {
      const hls = new Hls();

      hls.loadSource(videoURL);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        console.log("Flux HLS chargé.");
      });

      hls.on(Hls.Events.ERROR, (event, data) => {
        console.error("Erreur HLS :", data);
      });

    } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
      // Safari / iOS : HLS natif
      video.src = videoURL;

    } else {
      alert("Votre navigateur ne supporte pas la lecture HLS.");
    }

    // Play / Pause
    playPause.addEventListener("click", () => {
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    });

    video.addEventListener("play", () => {
      playPause.textContent = "❚❚";
    });

    video.addEventListener("pause", () => {
      playPause.textContent = "▶";
    });

    // Barre de progression
    video.addEventListener("timeupdate", () => {
      if (video.duration) {
        progress.value =
          (video.currentTime / video.duration) * 100;
      }

      time.textContent =
        formatTime(video.currentTime) +
        " / " +
        formatTime(video.duration);
    });

    progress.addEventListener("input", () => {
      if (video.duration) {
        video.currentTime =
          (progress.value / 100) * video.duration;
      }
    });

    // Volume
    volume.addEventListener("input", () => {
      video.volume = volume.value;

      if (video.volume === 0) {
        mute.textContent = "🔇";
      } else {
        mute.textContent = "🔊";
      }
    });

    // Mute
    mute.addEventListener("click", () => {
      video.muted = !video.muted;

      mute.textContent =
        video.muted ? "🔇" : "🔊";
    });

    // Plein écran
    fullscreen.addEventListener("click", () => {
      const player = document.querySelector(".player");

      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        player.requestFullscreen();
      }
    });

    // Format mm:ss
    function formatTime(seconds) {
      if (!isFinite(seconds)) {
        return "00:00";
      }

      const minutes = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);

      return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(secs).padStart(2, "0")
      );
    }
  </script>

</body>
</html>
