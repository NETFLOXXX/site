<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NETFLOX Player</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --red:#dc2626; --red-h:#ef4444; --glass:rgba(0,0,0,0.72); }

  body {
    background:#0a0a0a; font-family:'Outfit',sans-serif; color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; padding:20px;
  }

  /* ── LOAD SCREEN ── */
  #load-screen { width:100%; max-width:600px; text-align:center; }
  #load-screen h1 { font-size:2rem; font-weight:700; letter-spacing:-0.03em; margin-bottom:8px; }
  #load-screen h1 span { color:var(--red); }
  #load-screen > p { color:rgba(255,255,255,0.5); margin-bottom:16px; font-size:0.9rem; }
  
  .status-badge {
    display:inline-block; font-size:0.75rem; background:rgba(255,255,255,0.08); 
    padding:6px 14px; border-radius:20px; border:1px solid rgba(255,255,255,0.12); margin-bottom:24px;
    color:rgba(255,255,255,0.7);
  }

  .input-row {
    display:flex; gap:10px; background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12); border-radius:12px; padding:6px 6px 6px 16px;
  }
  .input-row input { flex:1; background:none; border:none; outline:none; color:#fff; font-family:'Outfit',sans-serif; font-size:0.95rem; }
  .input-row input::placeholder { color:rgba(255,255,255,0.3); }
  .input-row button {
    background:var(--red); border:none; color:#fff; font-family:'Outfit',sans-serif;
    font-weight:600; font-size:0.9rem; padding:10px 20px; border-radius:8px;
    cursor:pointer; transition:background 0.2s; white-space:nowrap;
  }
  .input-row button:hover { background:var(--red-h); }
  .examples { margin-top:20px; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .examples span { font-size:0.75rem; color:rgba(255,255,255,0.4); width:100%; margin-bottom:4px; }
  .chip {
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
    border-radius:20px; padding:5px 12px; font-size:0.75rem;
    color:rgba(255,255,255,0.5); cursor:pointer; transition:all 0.2s;
  }
  .chip:hover { background:rgba(220,38,38,0.15); border-color:var(--red); color:#fff; }

  /* ── PLAYER ── */
  #player-wrap {
    display:none; width:100%; max-width:1100px; position:relative;
    border-radius:16px; overflow:hidden; background:#000;
    box-shadow:0 40px 80px rgba(0,0,0,0.8); aspect-ratio:16/9;
  }

  video { width:100%; height:100%; object-fit:contain; display:block; }
  #player-wrap.paused video { filter:grayscale(1); }

  .overlay-gradient {
    position:absolute; inset:0;
    background:linear-gradient(to top, rgba(0,0,0,0.92) 0%, transparent 45%);
    pointer-events:none; opacity:0; transition:opacity 0.3s;
  }
  #player-wrap.cv .overlay-gradient { opacity:1; }

  #back-btn {
    position:absolute; top:16px; left:16px; z-index:50;
    display:flex; align-items:center; gap:8px; padding:8px 14px;
    background:var(--glass); border:none; outline:none; border-radius:10px;
    color:#fff; cursor:pointer; font-family:'Outfit',sans-serif; font-size:0.9rem; font-weight:500;
    opacity:0; transform:translateY(-4px); transition:opacity 0.3s, transform 0.25s;
    backdrop-filter:blur(8px);
  }
  #player-wrap.cv #back-btn { opacity:1; transform:translateY(0); }

  #center-controls {
    position:absolute; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center; gap:32px;
    opacity:0; transform:scale(0.88); transition:opacity 0.25s, transform 0.25s;
    pointer-events:none;
  }
  #player-wrap.cv #center-controls { opacity:1; transform:scale(1); pointer-events:all; }

  .cc-btn {
    border:none; outline:none; border-radius:50%; color:#fff; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,0.55); backdrop-filter:blur(8px);
    width:90px; height:90px;
  }

  #bottom-bar {
    position:absolute; bottom:0; left:0; right:0; z-index:50; padding:0 18px 18px;
    opacity:0; transform:translateY(8px); transition:opacity 0.3s, transform 0.3s;
  }
  #player-wrap.cv #bottom-bar { opacity:1; transform:translateY(0); }

  #progress-wrap { position:relative; height:18px; margin-bottom:10px; cursor:pointer; display:flex; align-items:center; }
  #progress-bg { width:100%; height:4px; background:rgba(255,255,255,0.2); border-radius:4px; overflow:hidden; position:relative; }
  #progress-fill { position:absolute; left:0; top:0; height:100%; background:var(--red); }

  .bottom-row { display:flex; align-items:center; justify-content:space-between; }
  .ctrl-btn { background:none; border:none; color:#fff; cursor:pointer; padding:8px; }
  .ctrl-btn svg { width:26px; height:26px; }

  #error-msg { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:12px; z-index:70; background:rgba(0,0,0,0.85); }
  #open-url-btn { display:none; margin-top:16px; background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12); border-radius:10px; padding:8px 18px; color:#fff; cursor:pointer; }
</style>
</head>
<body>

<div id="load-screen">
  <h1>NETFLOX <span>Player</span></h1>
  <p>Entrez un ID de film TMDB (ex: 424) ou une URL direct .m3u8 / .mp4</p>
  <div class="status-badge" id="domain-status">📡 Connexion au Proxy Worker...</div>

  <div class="input-row">
    <input type="text" id="url-input" placeholder="Exemple: 424" value="424" />
    <button onclick="loadURL()">▶ Lancer</button>
  </div>

  <div class="examples">
    <span>Exemples rapides :</span>
    <div class="chip" onclick="fillEx('424')">Film 424 (Streamflix)</div>
    <div class="chip" onclick="fillEx('550')">Film 550 (Fight Club)</div>
    <div class="chip" onclick="fillEx('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4')">MP4 Test</div>
  </div>
</div>

<div id="player-wrap">
  <video id="video" playsinline></video>
  <div class="overlay-gradient"></div>

  <div id="error-msg">
    <p id="error-text">Accès refusé ou flux incompatible.</p>
  </div>

  <button id="back-btn" onclick="goBack()">← Retour</button>

  <div id="center-controls">
    <button class="cc-btn" onclick="togglePlay()">
      <svg id="cc-play" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      <svg id="cc-pause" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
    </button>
  </div>

  <div id="bottom-bar">
    <div id="progress-wrap" onclick="doScrub(event)">
      <div id="progress-bg"><div id="progress-fill"></div></div>
    </div>
    <div class="bottom-row">
      <button class="ctrl-btn" onclick="togglePlay()">
        <svg id="play-icon" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <svg id="pause-icon" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>
      <span id="time-display">0:00 / --:--</span>
    </div>
  </div>
</div>

<button id="open-url-btn" onclick="goBack()">⊕ Choisir une autre vidéo</button>

<script>
const WORKER_PROXY = "https://netfloxxx.blague-drole-67.workers.dev/";
const video = document.getElementById('video');
const pw = document.getElementById('player-wrap');
const loadScreen = document.getElementById('load-screen');
const openBtn = document.getElementById('open-url-btn');
let hls = null;
let streamflixBase = "https://streamflix.mom";

async function initDomains() {
  try {
    const res = await fetch('./latest.json?t=' + Date.now());
    if (res.ok) {
      const data = await res.json();
      if (data.streamflix_url) streamflixBase = data.streamflix_url;
    }
  } catch(e) {}
  document.getElementById('domain-status').textContent = "🟢 Proxy actif : " + WORKER_PROXY;
}
initDomains();

function fillEx(val) { document.getElementById('url-input').value = val; loadURL(); }

function loadURL() {
  const val = document.getElementById('url-input').value.trim();
  if (!val) return;

  let targetUrl = val;
  if (/^\d+$/.test(val)) {
    targetUrl = `${streamflixBase}/api/movies/${val}/video-proxy`;
  }

  // Passage systématique par le Cloudflare Worker
  const finalProxyUrl = `${WORKER_PROXY}?url=${encodeURIComponent(targetUrl)}`;
  loadMedia(finalProxyUrl);
}

function loadMedia(url) {
  clearHLS(); hideError();
  loadScreen.style.display = 'none';
  pw.style.display = 'block';
  openBtn.style.display = 'inline-block';
  pw.classList.add('cv');

  if (url.includes('.m3u8') && Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(()=>{}));
    hls.on(Hls.Events.ERROR, () => showError());
  } else {
    video.src = url;
    video.play().catch(()=>{});
  }
  video.onerror = () => showError();
}

function clearHLS() { if (hls) { hls.destroy(); hls = null; } video.src = ''; }
function goBack() { video.pause(); clearHLS(); pw.style.display = 'none'; openBtn.style.display = 'none'; loadScreen.style.display = 'block'; }
function togglePlay() { if (video.paused) video.play(); else video.pause(); }

function doScrub(e) {
  const r = document.getElementById('progress-wrap').getBoundingClientRect();
  const x = Math.max(0, Math.min((e.clientX||e.pageX)-r.left, r.width));
  if (video.duration) video.currentTime = (x/r.width)*video.duration;
}

video.addEventListener('timeupdate', () => {
  const pct = video.duration ? (video.currentTime/video.duration)*100 : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  const fmt = s => isNaN(s) ? '--:--' : Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0');
  document.getElementById('time-display').textContent = `${fmt(video.currentTime)} / ${fmt(video.duration)}`;
});

video.addEventListener('play', () => {
  document.getElementById('play-icon').style.display='none'; document.getElementById('pause-icon').style.display='';
  document.getElementById('cc-play').style.display='none'; document.getElementById('cc-pause').style.display='';
});
video.addEventListener('pause', () => {
  document.getElementById('play-icon').style.display=''; document.getElementById('pause-icon').style.display='none';
  document.getElementById('cc-play').style.display=''; document.getElementById('cc-pause').style.display='none';
});

function showError() { document.getElementById('error-msg').style.display='flex'; }
function hideError() { document.getElementById('error-msg').style.display='none'; }
</script>
</body>
  
</html>
