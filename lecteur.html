<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecteur MP4</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#0b0b0f;color:#eee;font-family:system-ui,sans-serif}
  body{display:flex;flex-direction:column}
  form{display:flex;gap:8px;padding:10px;background:#15151c}
  input{flex:1;min-width:0;padding:10px 12px;border:1px solid #2a2a35;border-radius:8px;background:#0b0b0f;color:#eee;font-size:15px}
  button{padding:10px 18px;border:0;border-radius:8px;background:#e50914;color:#fff;font-weight:600;cursor:pointer}
  #wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
  video{width:100%;height:100%;background:#000;outline:none}
  #msg{position:absolute;color:#f66;pointer-events:none;text-align:center;padding:0 20px}
</style>
</head>
<body>
<form id="f">
  <input id="u" type="url" placeholder="Colle l'URL d'un .mp4 puis Entrée" autofocus>
  <button>Lire</button>
</form>
<div id="wrap">
  <video id="v" controls playsinline preload="auto"></video>
  <div id="msg"></div>
</div>
<script>
const v = document.getElementById('v'), u = document.getElementById('u'), m = document.getElementById('msg');

function play(url){
  m.textContent = '';
  if(!url) return;
  v.src = url;
  v.play().catch(()=>{ v.muted = true; v.play().catch(()=>{}); }); // autoplay bloqué → muet
  history.replaceState(null,'','?v='+encodeURIComponent(url));
}

document.getElementById('f').onsubmit = e => { e.preventDefault(); play(u.value.trim()); };
v.onerror = () => { m.textContent = "Impossible de lire cette vidéo (URL invalide, format non supporté ou accès bloqué par le serveur)."; };

// Raccourcis : espace, ←/→ ±10s, f plein écran, m muet
document.addEventListener('keydown', e => {
  if(e.target === u) return;
  if(e.code==='Space'){ e.preventDefault(); v.paused ? v.play() : v.pause(); }
  else if(e.key==='ArrowRight') v.currentTime += 10;
  else if(e.key==='ArrowLeft') v.currentTime -= 10;
  else if(e.key==='f') document.fullscreenElement ? document.exitFullscreen() : v.requestFullscreen();
  else if(e.key==='m') v.muted = !v.muted;
});

// ?v=URL pour lancer directement
const p = new URLSearchParams(location.search).get('v');
if(p){ u.value = p; play(p); }
</script>
</body>
</html>
